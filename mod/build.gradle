// PhiMC —— Stonecutter 中心构建脚本（每个版本节点各跑一遍）
//
// 节点名 = 目标 MC 版本（1.20.1 / 1.21.1 / 1.21.11），每个节点从
//   versions/<版本>/gradle.properties  取 deps.*（minecraft / yarn / loader / fabric-api）
//   src/main/java + src/main/resources 取共享源码（由 Stonecutter 按 //? 条件展开成该版本）
//
// 产物（同一份源码，两个 jar）：
//   * phimc-<MC>.jar        —— 完整版（mod id = phimc，入口 PhiMCClient）：物品 / 生存玩法 / 奖励
//   * phimcplayer-<MC>.jar  —— 打歌 only 变体（mod id = phimcplayer，入口 PhiMCLiteClient）：
//                              Shift + / 打开曲库，选歌打歌，成绩存本地，别的什么都没有。
//                              **先只做 1.21.1**（liteMcVersions，见文件末尾的 liteJar）。
//   两个 jar 的 class 完全重复，**只能二选一装**（详见 README「安装」）。
// ============================================================
plugins {
    id 'fabric-loom' version '1.19.2'
    id 'maven-publish'
}

def mcVersion = sc.current.version
def repoRoot = rootProject.projectDir.parentFile          // 仓库根（含 core/ 与 lib/）
// 1.20 ~ 1.20.4 跑 Java 17，1.20.5 起是 Java 21
def javaLevel = sc.current.parsed.matches('<1.20.5') ? JavaVersion.VERSION_17 : JavaVersion.VERSION_21

// 归档名就带 MC 版本：phimc-1.21.1.jar / phimc-1.20.1.jar / phimc-1.21.11.jar
version = mcVersion
group = property('maven_group')
base {
    archivesName = property('archives_base_name')
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${property('deps.minecraft')}"
    mappings "net.fabricmc:yarn:${property('deps.yarn')}:v2"
    modImplementation "net.fabricmc:fabric-loader:${property('deps.loader')}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${property('deps.fabric_api')}"

    // RPE（.pez）谱面包里的音乐是 <id>.mp3，JavaSound 自带解不了；
    // 用纯 Java 的 JLayer（LGPL）解成 PCM，交回 WavSource（core/audio/Mp3ToWav.java）。
    // 离线构建：jar 就放在仓库根的 lib/ 里，不引入 mavenCentral 依赖。
    implementation files(new File(repoRoot, 'lib/jlayer-1.0.1.4.jar'))

    // Phira 在线谱面库的曲绘是 WebP（2048×1080，实测全是 VP8 有损），JDK 的 ImageIO 和
    // Minecraft 用的 stb_image 都不认 WebP。用纯 Java 的 JWebP（MPL-2.0，无 native、无传递依赖）
    // 解成 BufferedImage 再转 PNG（见 CoverCodec）。同样离线：jar 放仓库根 lib/。
    implementation files(new File(repoRoot, 'lib/webp-0.2.0.jar'))
}

// core 是纯 Java 引擎（零 MC 依赖），与 mod 共用一份源码，避免复制粘贴
sourceSets {
    main {
        java {
            srcDir new File(repoRoot, 'core/src/main/java')
        }
    }
}

// ---- 按版本挑「数据/资源目录」（JSON 不能用 //? 条件注释）----
// 三个数据格式代 + 一个物品模型定义代，实测边界（对照各版本原版 jar）：
//   * 1.20.5 起 recipe 的 result 字段名 item → id
//   * 1.21   起数据目录 recipes→recipe、loot_tables→loot_table
//   * 1.21.4 起物品模型必须写在 assets/<ns>/items/<id>.json（模型定义），没有它物品没有模型
def dataEra = sc.current.parsed.matches('<1.20.5') ? 'data-1.20.4'
        : sc.current.parsed.matches('<1.21') ? 'data-1.20.5'
        : 'data-1.21'
def dataEraDir = new File(repoRoot, "mod/versioned-resources/${dataEra}")
if (!dataEraDir.isDirectory()) throw new GradleException("缺少版本资源目录：${dataEraDir}")
sourceSets.main.resources.srcDir(dataEraDir)

if (sc.current.parsed.matches('>=1.21.4')) {
    def modelEraDir = new File(repoRoot, 'mod/versioned-resources/assets-1.21.4')
    if (!modelEraDir.isDirectory()) throw new GradleException("缺少版本资源目录：${modelEraDir}")
    sourceSets.main.resources.srcDir(modelEraDir)
}

def modVersion = property('mod_version').toString()
def mcDep = property('mod.mc_dep').toString()
def javaDep = property('mod.java_dep').toString()

processResources {
    inputs.property "mod_version", modVersion
    inputs.property "mc_dep", mcDep
    inputs.property "java_dep", javaDep
    filesMatching("fabric.mod.json") {
        expand(
            "mod_version": modVersion,
            "mc_dep": mcDep,
            "java_dep": javaDep
        )
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = javaLevel.majorVersion.toInteger()
    it.options.encoding = "UTF-8"
}

java {
    withSourcesJar()
    sourceCompatibility = javaLevel
    targetCompatibility = javaLevel
}

// ============================================================
// 产物一：完整版 phimc-<MC>.jar（mod id = phimc，入口 PhiMCClient）
// 描述文件在 src/main/resources/fabric.mod.json
// ============================================================
jar {
    from(new File(repoRoot, 'LICENSE')) {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
    // JLayer 的类直接摊进 mod jar。Fabric 只会从 mods/ 加载这一个 jar，
    // 摊平（而不是 include 成嵌套 jar）少一层 loader 依赖，也不会出现两份 javazoom 类。
    from(zipTree(new File(repoRoot, 'lib/jlayer-1.0.1.4.jar'))) {
        exclude 'META-INF/MANIFEST.MF'
        exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
        exclude 'META-INF/maven/**'
    }
    // JWebP（WebP 解码）同理摊平；javafx 那部分用不到，也一并摊平（不加载就不会解析）
    from(zipTree(new File(repoRoot, 'lib/webp-0.2.0.jar'))) {
        exclude 'META-INF/MANIFEST.MF'
        exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
        exclude 'META-INF/maven/**'
    }
    // MPL-2.0 要求随分发保留许可证与来源说明
    from(new File(repoRoot, 'lib/webp-LICENSE.txt')) {
        rename { 'LICENSE_jwebp' }
    }
}

// ============================================================
// 产物二（构建变体）：lite / 「打歌 only」—— phimcplayer-<MC>.jar
//   * 同一份源码树、同一批 class，**另一个 mod id**（phimcplayer）与另一个入口；
//   * jar 里**只**换 fabric.mod.json（mod/lite-resources/fabric.mod.json），
//     其余每一个条目都直接取自完整版已经 remap 好的 jar —— 所以不存在「两套映射」的坑
//     （Loom 只 remap 一次：remapJar。自己再 remap 一遍反而容易把 named/intermediary 搞混）；
//   * 产物名 phimcplayer-<MC>.jar，并自动复制到 mod/dist/。
//
// 为什么是「构建变体」而不是「同一 jar 里的模式开关」：
//   用户要求物品 / 生存玩法与「只打歌」彻底分开。同一个 jar 里的开关永远意味着
//   「代码在、只是不执行」，而这里 lite 的入口 PhiMCLiteClient **不调用**
//   PhiMCRegistry.register()，物品在那次启动里根本没进注册表。
//
// 二选一：两个 jar 的 class 名完全重复（同一批源码），不能同时装。
//   lite 的 fabric.mod.json 里写了 "breaks": {"phimc": "*"}，同时装会被 loader 直接拒绝。
//
// 先只做 1.21.1：验证通过后再把版本加进 liteMcVersions（其余 18 个版本的构建完全不受影响：
//   不在集合里就不注册 liteJar，:其它版本:build 与以前逐字节等价）。
def liteMcVersions = [
        '1.20', '1.20.1', '1.20.2', '1.20.3', '1.20.4', '1.20.5', '1.20.6',
        '1.21', '1.21.1', '1.21.2', '1.21.3', '1.21.4', '1.21.5',
        '1.21.6', '1.21.7', '1.21.8', '1.21.9', '1.21.10', '1.21.11'
] as Set
def liteEnabled = liteMcVersions.contains(mcVersion.toString())
// 注意：Stonecutter 每个版本节点是一个子项目，projectDir 是 mod/versions/<MC>/，
// 而描述文件放在 mod/lite-resources/（= 根项目目录）。写错成 project.projectDir 会找不到文件。
def modDir = rootProject.projectDir
def liteDescriptorDir = new File(modDir, 'lite-resources')

if (liteEnabled) {
    if (!new File(liteDescriptorDir, 'fabric.mod.json').isFile()) {
        throw new GradleException("缺少 lite 变体的描述文件：${liteDescriptorDir}/fabric.mod.json")
    }

    tasks.register('liteJar', Jar) { Jar t ->
        t.group = 'build'
        t.description = '「打歌 only」变体：phimcplayer-<MC>.jar（mod id = phimcplayer，入口 PhiMCLiteClient）'
        // 必须等完整版 remap 完：lite 的 class 是从那个 jar 里原样取的
        t.dependsOn tasks.named('remapJar')
        t.archiveBaseName = 'phimcplayer'
        t.archiveVersion = mcVersion
        t.destinationDirectory = layout.buildDirectory.dir('libs')

        // 完整版 jar 的全部内容（已 remap），只剔掉「描述文件」和 manifest（Jar 任务自己生成）
        def completeJar = tasks.named('remapJar').flatMap { it.archiveFile }
        t.from(completeJar.map { zipTree(it) }) {
            exclude 'META-INF/MANIFEST.MF'
            exclude 'fabric.mod.json'
        }
        // 换成 lite 的那一份（占位符与完整版同一套：mod_version / mc_dep / java_dep）
        t.from(new File(liteDescriptorDir, 'fabric.mod.json')) {
            expand(
                'mod_version': modVersion,
                'mc_dep': mcDep,
                'java_dep': javaDep
            )
        }
    }

    // 打到 mod/dist/（用户拿成品的地方）；用 Copy 而不是 doLast，
    // 这样 dist 里的 jar 被删掉后重跑 build 会重新复制（up-to-date 检查覆盖到输出目录）
    tasks.register('liteDist', Copy) {
        dependsOn tasks.named('liteJar')
        from tasks.named('liteJar').flatMap { it.archiveFile }
        into new File(modDir, 'dist')
    }

    tasks.named('assemble') {
        dependsOn tasks.named('liteJar'), tasks.named('liteDist')
    }

    logger.lifecycle("[phimc] lite 变体已启用（${mcVersion}）：assemble 会额外产出 phimcplayer-${mcVersion}.jar")
}

